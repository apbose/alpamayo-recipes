defaults:
  - sft_base
  - /models/ar1_5_shortcut_reference@model
  - _self_

# Route-less Stage-2 experiment backed by official PhysicalAI-AV Hugging Face
# range reads. The immutable revision and explicit manifests make the sample
# population reproducible; no navigation text is fabricated.
data:
  train_dataset:
    _target_: alpamayo.data.pai_trajectory.PAITrajectoryDataset
    _recursive_: false
    access_mode: hf_stream
    local_dir: null
    use_default_keyframe: false
    hf_revision: 33f9bf447ed3bcb7d545ce13f4226f824214fafb
    hf_cache_dir: ???
    annotations_path: ???
    chunk_ids: null
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo.data.pai_trajectory.PAITrajectoryDataset
    _recursive_: false
    access_mode: hf_stream
    local_dir: null
    use_default_keyframe: false
    hf_revision: 33f9bf447ed3bcb7d545ce13f4226f824214fafb
    hf_cache_dir: ???
    annotations_path: ???
    chunk_ids: null
    vla_preprocess_args:
      generation_mode: true

paths:
  output_dir: output_stage2_trajectory_shortcut_hf_reference

trainer:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  deepspeed: null
  # Both branches exercise every trainable Action-Expert/adapter parameter.
  ddp_find_unused_parameters: false
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null

performance:
  # The existing unbounded feature cache targets local archives and is unsafe
  # for thousands of streamed clips. Hugging Face still caches metadata.
  zip_cache: false
  collate_cache: false

# Evaluation is run afterward with the matched, fixed route-less benchmark.
evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_shortcut_stage2_trajectory_hf_reference
