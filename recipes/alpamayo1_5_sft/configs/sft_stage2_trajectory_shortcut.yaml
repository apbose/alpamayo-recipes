defaults:
  - sft_base
  - /models/ar1_5_shortcut@model
  - _self_

# Route-less Stage-2 shortcut experiment. This is intentionally separate from
# sft_stage2_nav_shortcut: rows contain clip/timestamp trajectories but no
# navigation command, and the default processor omits the route component.
data:
  train_dataset:
    _target_: alpamayo.data.pai_trajectory.PAITrajectoryDataset
    _recursive_: false
    local_dir: ???
    annotations_path: ???
    chunk_ids: [214, 224, 276, 317, 420, 727, 728, 968, 982,
                1519, 1657, 1984, 2277, 2368, 2372, 2447, 2599, 2634, 2868]
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo.data.pai_trajectory.PAITrajectoryDataset
    _recursive_: false
    local_dir: ???
    annotations_path: ???
    chunk_ids: [214, 224, 276, 317, 420, 727, 728, 968, 982,
                1519, 1657, 1984, 2277, 2368, 2372, 2447, 2599, 2634, 2868]
    vla_preprocess_args:
      generation_mode: true

paths:
  output_dir: output_stage2_trajectory_shortcut

trainer:
  gradient_checkpointing: false
  deepspeed: null
  ddp_find_unused_parameters: true

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_shortcut_stage2_trajectory_route_less
